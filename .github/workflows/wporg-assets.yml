name: Update WordPress.org assets

# Banners, icons, screenshots (.wordpress-org/) and readme.txt go live on the
# plugin page as soon as they change on main, without a release. Code only
# ships with a tag (deploy.yml).
on:
  push:
    branches: [main]
    paths:
      - ".wordpress-org/**"
      - "readme.txt"

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: orbitwrite
          IGNORE_OTHER_FILES: true
